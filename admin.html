
<!DOCTYPE html>

<style>
*{box-sizing:border-box}
body{background:#fff5e9;color:#655046;font-family:system-ui,sans-serif;padding:15px}
main{max-width:650px;margin:auto;background:white;padding:22px;border-radius:24px}
h1,h2{text-align:center}
button,select,a.link{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:16px}
button,a.link{background:#b48c70;color:white;text-align:center;text-decoration:none}
button:disabled{opacity:.45}
select{background:#f6eee5}
.stats{display:flex;gap:8px}
.stat{flex:1;padding:12px 4px;text-align:center;border-radius:12px;background:#eee0d1}
.boy{background:#e3efff}
.girl{background:#ffe4ed}
.record{padding:12px 0;border-bottom:1px solid #ddd;overflow-wrap:anywhere}
.winner{background:#fff3d6;padding:15px;margin:10px 0;border-radius:12px;overflow-wrap:anywhere}
.publish{background:#927457}
.demo{background:#85a9c7}
.revealBox{background:#fff7ed;padding:18px;border-radius:22px;margin:20px 0;text-align:center}
.blueButton{background:#7faeda}
.pinkButton{background:#df96b3}
[hidden]{display:none!important}
#status,#uid{overflow-wrap:anywhere}
#penguinShow{
position:fixed;inset:0;z-index:99999;
background:linear-gradient(135deg,#dceeff,#ffe2ed,#fff4df);
overflow:auto;padding:20px;text-align:center
}
#penguinCard{
max-width:480px;margin:15px auto;background:#fffdf8;
padding:22px;border-radius:30px;box-shadow:0 10px 35px #9993
}
#penguinBaby{width:180px;margin:auto;animation:dance .7s infinite alternate}
@keyframes dance{
from{transform:rotate(-10deg)}
to{transform:rotate(10deg)}
}
#penguinCount{font-size:65px;font-weight:bold;color:#e887ad}
#penguinGift{font-size:65px}
#penguinName{font-size:23px;font-weight:bold;overflow-wrap:anywhere}
#penguinNames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.penguinWinner{padding:15px 5px;background:#fff0d9;border-radius:15px;overflow-wrap:anywhere;animation:pop .5s ease}
@keyframes pop{
from{transform:scale(.2);opacity:0}
to{transform:scale(1);opacity:1}
}
.confetti{
position:fixed;top:-30px;z-index:100000;pointer-events:none;
animation:fall 3s linear forwards
}
@keyframes fall{
to{transform:translateY(110vh) rotate(720deg)}
}
@media(prefers-reduced-motion:reduce){
#penguinBaby,.penguinWinner{animation:none}
.confetti{display:none}
}
</style>
</head>

<script type="module">

import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,GoogleAuthProvider,signInWithPopup,
signOut,onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getDatabase,ref,onValue,get,
runTransaction,serverTimestamp
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyDoYaeKknmL12xhRsgSV1ovowB9OJkgnT8",
authDomain:"tofu-baby-gender-2026.firebaseapp.com",
databaseURL:"https://tofu-baby-gender-2026-default-rtdb.firebaseio.com",
projectId:"tofu-baby-gender-2026",
storageBucket:"tofu-baby-gender-2026.firebasestorage.app",
messagingSenderId:"478157000720",
appId:"1:478157000720:web:354481824c1c4aef53ba95"
};

const ADMIN_UID="YJlctW9t94VvutDqK73jqmzZDuE3";
const DEADLINE=1796400000000;
const WINNER_COUNT=8;

const app=initializeApp(firebaseConfig,"admin");
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let votes=[],winners=[];
let result=null,publicResult=null,reveal=null;
let ready=false,lotteryReady=false;
let publicReady=false,revealReady=false;
let offsetReady=false;
let offset=0,busy=false,stops=[];

function genderText(g){
return g==="boy"?"男寶寶":g==="girl"?"女寶寶":"未知";
}

function isAdmin(){
return auth.currentUser?.uid===ADMIN_UID
&&!auth.currentUser.isAnonymous;
}

function revealed(){
return reveal?.published===true&&
["boy","girl"].includes(reveal.gender);
}

function maskName(name){
const chars=Array.from(String(name||"").trim());
if(chars.length<=1)return "○";
if(chars.length===2)return chars[0]+"○";
return chars[0]+
"○".repeat(Math.min(chars.length-2,46))+
chars[chars.length-1];
}

function update(){

const gender=revealed()?reveal.gender:"";

$("gender").value=gender;
$("gender").disabled=true;

const count=votes.filter(v=>
v.gender===gender&&v.consent===true
).length;

$("eligible").textContent="符合資格："+count+" 人";

const closed=Date.now()+offset>=DEADLINE;

const canReveal=isAdmin()&&revealReady&&
lotteryReady&&offsetReady&&closed&&!reveal&&!busy;

$("publishBoy").disabled=!canReveal;
$("publishGirl").disabled=!canReveal;

$("demoBoy").disabled=!isAdmin()||busy;
$("demoGirl").disabled=!isAdmin()||busy;
$("playReveal").disabled=!isAdmin()||!revealed()||busy;

$("revealStatus").textContent=
!revealReady?"等待公布資料":
revealed()?"🎉 已正式公布："+genderText(gender):
reveal?"公布資料異常，請檢查":
!offsetReady?"等待伺服器時間":
!closed?"投票截止後才能正式公布性別":
"可以正式公布寶寶性別";

$("draw").disabled=
!isAdmin()||!ready||!lotteryReady||
!offsetReady||!revealReady||!revealed()||
busy||!!result||!count||!closed;

$("exportAll").disabled=!isAdmin()||!ready;

$("exportWinners").disabled=
!isAdmin()||!ready||!result||!winners.length;

$("animate").disabled=
!isAdmin()||!ready||!lotteryReady||
!result||busy||!winners.length||
winners.length!==Object.keys(result?.winners||{}).length;

$("demo").disabled=!isAdmin()||busy;

$("publish").disabled=
!isAdmin()||!ready||!lotteryReady||
!publicReady||!result||!winners.length||
winners.length!==Object.keys(result?.winners||{}).length||
winners.length>WINNER_COUNT||
busy||!!publicResult;

$("drawStatus").textContent=result?
"正式抽獎已完成，不可重複抽獎":
!lotteryReady?"等待抽獎權限":
!offsetReady?"等待伺服器時間":
!closed?"尚未到投票截止時間":
!revealed()?"請先正式公布寶寶性別":
!ready?"等待投票資料":
!count?"目前沒有符合資格的投票者":
"投票已截止，可以抽獎";

$("publishStatus").textContent=
publicResult?.published===true?
"✅ 中獎名單已正式公布":
!publicReady?"等待公布資料權限":
"尚未公布";
}

function render(){

$("boy").textContent=
votes.filter(v=>v.gender==="boy").length;

$("girl").textContent=
votes.filter(v=>v.gender==="girl").length;

$("total").textContent=votes.length;

$("list").replaceChildren();

votes.forEach((v,i)=>{
const div=document.createElement("div");
div.className="record";
div.textContent=(i+1)+"．"+v.name+
"｜"+genderText(v.gender)+
"｜收件地址："+v.address;
$("list").appendChild(div);
});

$("winners").replaceChildren();
winners=[];

if(result){

winners=Object.keys(result.winners||{})
.map(uid=>votes.find(v=>v.uid===uid))
.filter(Boolean);

winners.forEach((v,i)=>{
const div=document.createElement("div");
div.className="winner";
div.textContent="🏆 幸運得主 "+(i+1)+
"｜"+v.name+"｜收件地址："+v.address;
$("winners").appendChild(div);
});

}else{
$("winners").textContent="尚未抽獎";
}

update();
}

$("login").onclick=async()=>{
try{
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
await signInWithPopup(auth,provider);
}catch(e){
$("status").textContent="登入失敗："+e.code;
}
};

$("logout").onclick=()=>{
closeAnimation();
return signOut(auth);
};

onAuthStateChanged(auth,user=>{

closeAnimation();
stops.forEach(fn=>fn());
stops=[];

votes=[];
winners=[];
result=null;
publicResult=null;
reveal=null;

ready=false;
lotteryReady=false;
publicReady=false;
revealReady=false;
offsetReady=false;

$("panel").hidden=true;
$("list").replaceChildren();
$("winners").replaceChildren();
$("gender").value="";
$("uid").textContent="";

const loggedIn=!!user&&!user.isAnonymous;

$("login").hidden=loggedIn;
$("logout").hidden=!loggedIn;

if(!loggedIn){
$("status").textContent="尚未登入";
return;
}

$("uid").textContent="UID："+user.uid;

if(!isAdmin()){
$("status").textContent="非授權管理員";
return;
}

$("panel").hidden=false;
$("status").textContent="管理員登入成功";
update();

stops.push(onValue(ref(db,".info/serverTimeOffset"),
s=>{
offset=s.val()||0;
offsetReady=true;
update();
},
()=>{
offsetReady=false;
update();
}
));

stops.push(onValue(ref(db,"votes"),
s=>{
votes=Object.entries(s.val()||{})
.map(([uid,v])=>({...v,uid}));
ready=true;
$("status").textContent="資料讀取成功";
render();
},
()=>{
ready=false;
votes=[];
$("status").textContent="投票資料讀取失敗";
render();
}
));

stops.push(onValue(ref(db,"lottery"),
s=>{
result=s.val();
lotteryReady=true;
render();
},
()=>{
lotteryReady=false;
result=null;
render();
}
));

stops.push(onValue(ref(db,"publicWinners"),
s=>{
publicResult=s.val();
publicReady=true;
update();
},
()=>{
publicReady=false;
update();
}
));

stops.push(onValue(ref(db,"genderReveal"),
s=>{
reveal=s.val();
revealReady=true;
update();
},
()=>{
reveal=null;
revealReady=false;
update();
}
));

});

setInterval(update,1000);

// 正式性別公布

async function publishGender(type){

const button=type==="boy"?$("publishBoy"):$("publishGirl");

if(!isAdmin()||button.disabled)return;

if(!confirm(
"確定正式公布："+genderText(type)+
"？\n\n所有親友將可以觀看性別揭曉。\n正式公布只能執行一次！"
))return;

const check=prompt(
"為避免按錯，請輸入「"+genderText(type)+"」確認公布"
);

if(check!==genderText(type)){
alert("已取消公布，沒有更改任何資料。");
return;
}

prepareAudio();
busy=true;
update();

try{

const saved=await runTransaction(
ref(db,"genderReveal"),
current=>{
if(current!==null)return;
return {
published:true,
gender:type,
createdAt:serverTimestamp()
};
},
{applyLocally:false}
);

if(saved.committed){
if(isAdmin()){
openGenderAnimation(type,false);
}
}else{
alert("已有正式性別公布紀錄");
}

}catch(e){
alert("性別公布失敗："+e.message);
}finally{
busy=false;
update();
}
}

$("publishBoy").onclick=()=>publishGender("boy");
$("publishGirl").onclick=()=>publishGender("girl");

// 正式抽獎

function randomIndex(max){
const a=new Uint32Array(1);
const range=4294967296;
const limit=range-(range%max);
do{
crypto.getRandomValues(a);
}while(a[0]>=limit);
return a[0]%max;
}

$("draw").onclick=async()=>{

if($("draw").disabled)return;

const gender=reveal.gender;

if(!confirm(
"確認由猜中"+genderText(gender)+
"的投票者抽出最多8位得主？正式抽獎只能執行一次。"
))return;

prepareAudio();
busy=true;
update();

try{

const snapshot=await get(ref(db,"votes"));

const pool=Object.entries(snapshot.val()||{})
.map(([uid,v])=>({...v,uid}))
.filter(v=>v.gender===gender&&v.consent===true);

if(!pool.length){
alert("沒有符合資格的投票者");
return;
}

const selected={};
const selectedNames=[];
const count=Math.min(WINNER_COUNT,pool.length);

for(let i=0;i<count;i++){
const index=randomIndex(pool.length);
const winner=pool.splice(index,1)[0];
selected[winner.uid]=true;
selectedNames.push(maskName(winner.name));
}

const saved=await runTransaction(
ref(db,"lottery"),
current=>{
if(current!==null)return;
return {
gender:gender,
createdAt:serverTimestamp(),
winners:selected
};
},
{applyLocally:false}
);

if(saved.committed){
if(isAdmin())openAnimation(selectedNames,false);
}else{
alert("已存在正式抽獎紀錄");
}

}catch(e){
alert("抽獎失敗："+e.message);
}finally{
busy=false;
update();
}
};

// 正式中獎名單公布

$("publish").onclick=async()=>{

if($("publish").disabled)return;

const names={};

winners.slice(0,WINNER_COUNT).forEach((v,i)=>{
names[i]=maskName(v.name);
});

const preview=Object.values(names).join("\n");

if(!confirm(
"確認公布以下中獎姓名？\n\n"+
genderText(result.gender)+"\n\n"+
preview+"\n\n不會公布收件地址。"
))return;

busy=true;
update();

try{

const payload={
published:true,
gender:result.gender,
names:names
};

const saved=await runTransaction(
ref(db,"publicWinners"),
current=>{
if(current!==null)return;
return payload;
},
{applyLocally:false}
);

if(saved.committed){
alert("🎉 中獎名單已正式公布！");
}else{
alert("已有公開中獎紀錄");
}

}catch(e){
alert("公布失敗："+e.message);
}finally{
busy=false;
update();
}
};

// CSV名單匯出

function csvCell(value){
let text=String(value??"");
if(/^[\s]*[=+@-]|^[\t\r\n]/.test(text)){
text="'"+text;
}
return '"'+text.replace(/"/g,'""')+'"';
}

function downloadCSV(data,name){

const rows=[
["編號","姓名","猜測性別","收件地址"],
...data.map((v,i)=>[
i+1,v.name,genderText(v.gender),v.address
])
];

const csv="\uFEFF"+rows.map(
row=>row.map(csvCell).join(",")
).join("\r\n");

const blob=new Blob([csv],{
type:"text/csv;charset=utf-8;"
});

const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=name+".csv";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$("exportAll").onclick=()=>{
if(isAdmin()&&ready){
downloadCSV(votes,"豆腐寶寶全部投票名單");

$("exportWinners").onclick=()=>{

let animationMode="lottery";
let animationGender=null;
let audio=null;

function prepareAudio(){
try{
const AudioClass=window.AudioContext||
window.webkitAudioContext;
if(!AudioClass)return;
audio=audio||new AudioClass();
audio.resume().catch(()=>{});
}catch(e){}
}

function playSound(){

if(!audio)return;

try{
[523,659,784,1047,784,1047].forEach((hz,i)=>{
const osc=audio.createOscillator();
const gain=audio.createGain();
const t=audio.currentTime+i*.15;
osc.frequency.value=hz;
gain.gain.setValueAtTime(.08,t);
gain.gain.exponentialRampToValueAtTime(.001,t+.25);
osc.connect(gain);
gain.connect(audio.destination);
osc.start(t);
osc.stop(t+.25);
});
}catch(e){}
}

function confetti(type){

const icons=type==="boy"?
["🎉","💙","🎈","⭐","✨"]:
type==="girl"?
["🎉","🩷","🌸","🎈","✨"]:
["🎉","💙","🩷","⭐","✨"];

for(let i=0;i<50;i++){
const el=document.createElement("span");
el.className="confetti";
el.textContent=icons[i%icons.length];
el.style.left=Math.random()*100+"vw";
el.style.fontSize=(12+Math.random()*20)+"px";
el.style.animationDelay=Math.random()*.5+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),4000);
}
}

function setupAnimation(){

closeAnimation();

animationActive=true;
animationRunning=false;

$("penguinShow").hidden=false;

$("penguinShow").style.background=
"linear-gradient(135deg,#dceeff,#ffe2ed,#fff4df)";

$("penguinBaby").innerHTML=penguin("");
$("penguinCount").textContent="";
$("penguinGift").textContent="🎁";
$("penguinNext").disabled=false;
$("penguinNext").textContent="🎉 開始揭曉";
}

function openGenderAnimation(type,test){

if(!isAdmin()||!["boy","girl"].includes(type))return;

setupAnimation();

animationMode="gender";
animationGender=type;

$("showTitle").textContent="幸福性別揭曉派對";

$("penguinMode").textContent=test?
"🎮 模擬性別｜不代表寶寶真實性別":
"🎀 正式性別揭曉";

$("penguinName").textContent=
"小王子還是小公主？";
}

$("demoBoy").onclick=()=>{
prepareAudio();
openGenderAnimation("boy",true);
};

$("demoGirl").onclick=()=>{
prepareAudio();
openGenderAnimation("girl",true);
};

$("playReveal").onclick=()=>{
if(!isAdmin()||!revealed()||busy)return;
prepareAudio();
openGenderAnimation(reveal.gender,false);
};

function openAnimation(list,test){

if(!isAdmin()||!list.length)return;

setupAnimation();

animationMode="lottery";
animationNames=list.slice(0,WINNER_COUNT);
animationIndex=0;

$("showTitle").textContent="幸福幸運大抽獎";

$("penguinMode").textContent=test?
"🎮 模擬模式｜不影響正式資料":
"🏆 正式中獎名單揭曉";

$("penguinName").textContent=
"準備迎接 "+animationNames.length+
" 位幸運得主！";
}

$("demo").onclick=()=>{
if(!isAdmin())return;
prepareAudio();
openAnimation([
"測試寶寶A","測試寶寶B",
"測試寶寶C","測試寶寶D",
"測試寶寶E","測試寶寶F",
"測試寶寶G","測試寶寶H"
],true);
};

$("animate").onclick=()=>{
if($("animate").disabled||!isAdmin())return;
prepareAudio();
openAnimation(winners.map(v=>maskName(v.name)),false);
};

function showGender(){

if(!animationActive||!isAdmin()){
closeAnimation();
return;
}

const type=animationGender;

$("penguinBaby").innerHTML=penguin(type);
$("penguinCount").textContent="🎉";
$("penguinGift").textContent=type==="boy"?"💙":"🩷";

$("penguinName").textContent=type==="boy"?
"IT'S A BOY! 恭喜！是男寶寶！":
"IT'S A GIRL! 恭喜！是女寶寶！";

$("penguinShow").style.background=type==="boy"?
"linear-gradient(135deg,#cce9ff,#eef8ff,#fff5e8)":
"linear-gradient(135deg,#ffd7e8,#fff0f6,#fff5e8)";

$("penguinNext").textContent="🔄 再看一次性別揭曉";
$("penguinNext").disabled=false;
animationRunning=false;

playSound();
confetti(type);
}

function revealWinner(){

if(!animationActive||!isAdmin()){
closeAnimation();
return;
}

$("penguinCount").textContent="🎉";
$("penguinGift").textContent="🎊";

const name=animationNames[animationIndex];

$("penguinName").textContent=
"恭喜第 "+(animationIndex+1)+" 位："+name;

const card=document.createElement("div");
card.className="penguinWinner";
card.textContent=
"🏆 第 "+(animationIndex+1)+" 位 "+name;

$("penguinNames").appendChild(card);

animationIndex++;
animationRunning=false;

playSound();
confetti();

if(animationIndex>=animationNames.length){
$("penguinNext").textContent="🎊 全部揭曉完成";
$("penguinNext").disabled=true;
}else{
$("penguinNext").textContent="🎁 揭曉下一位";
$("penguinNext").disabled=false;
}
}

$("penguinNext").onclick=()=>{

if(!animationActive||animationRunning||!isAdmin())return;

if(animationMode==="lottery"&&
animationIndex>=animationNames.length)return;

prepareAudio();

animationRunning=true;
$("penguinNext").disabled=true;
$("penguinGift").textContent="🎁";

if(animationMode==="gender"){
$("penguinBaby").innerHTML=penguin("");
$("penguinShow").style.background=
"linear-gradient(135deg,#dceeff,#ffe2ed,#fff4df)";
}

$("penguinName").textContent=animationMode==="gender"?
"寶寶性別即將揭曉...":
"幸運得主即將揭曉...";

let count=3;
$("penguinCount").textContent=count;

function tick(){

if(!animationActive||!isAdmin()){
closeAnimation();
return;
}

count--;

if(count>0){
$("penguinCount").textContent=count;
animationTimer=setTimeout(tick,1000);
}else{
if(animationMode==="gender"){
showGender();
}else{
revealWinner();
}
}
}

animationTimer=setTimeout(tick,1000);
};

function closeAnimation(){

animationActive=false;
animationRunning=false;
clearTimeout(animationTimer);

animationNames=[];
animationIndex=0;
animationGender=null;

$("penguinNames").replaceChildren();
$("penguinName").textContent="";
$("penguinShow").hidden=true;

document.querySelectorAll(".confetti")
.forEach(el=>el.remove());
}

$("penguinClose").onclick=closeAnimation;

</script>
</body>
</html>
