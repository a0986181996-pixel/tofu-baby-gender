<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>豆腐寶寶｜管理後台</title>
<style>
body{
font-family:system-ui,sans-serif;
background:#fff5e9;
color:#655046;
padding:20px;
}
main{
max-width:600px;
margin:auto;
background:white;
padding:24px;
border-radius:24px;
}
h1{text-align:center;}
button{
width:100%;
padding:14px;
margin:8px 0;
border:0;
border-radius:12px;
background:#b48c70;
color:white;
font-size:16px;
}
.stats{
display:flex;
gap:8px;
}
.stat{
flex:1;
background:#faf1e8;
border-radius:12px;
padding:12px;
text-align:center;
}
.record{
padding:12px;
border-bottom:1px solid #ddd;
overflow-wrap:anywhere;
}
#status,#uid{
overflow-wrap:anywhere;
}
[hidden]{display:none!important;}
</style>
</head>
<body>
<main>
<h1>👶 豆腐寶寶</h1>
<h2>管理員專屬後台</h2>

<button id="login">Google 管理員登入</button>
<button id="logout" hidden>登出</button>

<p id="status">尚未登入</p>
<p id="uid"></p>

<section id="panel" hidden>
<div class="stats">
<div class="stat">💙 男寶寶
<h2 id="boy">0</h2></div>
<div class="stat">🩷 女寶寶
<h2 id="girl">0</h2></div>
<div class="stat">總票數
<h2 id="total">0</h2></div>
</div>
<h3>📋 投票名單</h3>
<div id="list"></div>
</section>
</main>

<script type="module">
import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getDatabase,
ref,
onValue
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyDoYaeKknmL12xhRsgSV1ovowB9OJkgnT8",
authDomain:"tofu-baby-gender-2026.firebaseapp.com",
databaseURL:"https://tofu-baby-gender-2026-default-rtdb.firebaseio.com",
projectId:"tofu-baby-gender-2026",
storageBucket:"tofu-baby-gender-2026.firebasestorage.app",
messagingSenderId:"478157000720",
appId:"1:478157000720:web:354481824c1c4aef53ba95"
};

const app=initializeApp(firebaseConfig,"admin");
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);
let stop=null;

$("login").onclick=async()=>{
try{
const provider=new GoogleAuthProvider();
provider.setCustomParameters({
prompt:"select_account"
});
await signInWithPopup(auth,provider);
}catch(e){
$("status").textContent="登入失敗："+e.code;
}
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
if(stop){stop();stop=null;}
$("panel").hidden=true;
$("list").replaceChildren();
$("uid").textContent="";
$("boy").textContent="0";
$("girl").textContent="0";
$("total").textContent="0";

const loggedIn=!!user&&!user.isAnonymous;
$("login").hidden=loggedIn;
$("logout").hidden=!loggedIn;

if(!loggedIn){
$("status").textContent="尚未登入";
return;
}

$("status").textContent="Google 登入成功";
$("uid").textContent="管理員 UID："+user.uid;

stop=onValue(ref(db,"votes"),snapshot=>{
const votes=Object.values(snapshot.val()||{});
$("boy").textContent=
votes.filter(v=>v.gender==="boy").length;
$("girl").textContent=
votes.filter(v=>v.gender==="girl").length;
$("total").textContent=votes.length;
$("list").replaceChildren();

votes.forEach((v,i)=>{
const div=document.createElement("div");
div.className="record";
div.textContent=
(i+1)+"．"+v.name+"｜"+
(v.gender==="boy"?"💙 男寶寶":"🩷 女寶寶")+
"｜收件地址："+v.address;
$("list").appendChild(div);
});

$("status").textContent="資料讀取成功";
$("panel").hidden=false;

},error=>{
$("panel").hidden=true;
$("list").replaceChildren();
$("status").textContent=
"登入成功，尚未取得資料庫讀取權限";
});
});
</script>
</body>
</html>
